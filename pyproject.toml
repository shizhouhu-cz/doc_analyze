[project]
name = "doc-analyze"
version = "0.1.0"
description = "DOCX 标书结构化提取与查询系统（第一阶段）"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1",
    "lxml>=5.0",
    "typer>=0.12",
    "pydantic>=2.7",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "openai>=1.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.scripts]
doc-analyze = "doc_analyze.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_analyze"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["local: 需要真实招标文件，跑端到端"]
