# doc-analyze 配置文件（优先级：环境变量 > 本文件 > 代码默认值）

[app]
db_path = "doc_analyze.db" # SQLite 路径；相对路径基于项目根
max_agent_rounds = 6       # Agent 单次问答最大工具循环轮数
max_chars = 4000           # get_chapter 单次返回正文上限（字符）
top_k = 5                  # search_content 返回条数

